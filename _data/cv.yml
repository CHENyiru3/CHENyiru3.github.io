        - "Project: SpatialTCR - An integrated platform for high-resolution spatial sequencing of T cell receptor repertoires"
        - Collaborated with wet lab members to develop spatial TCR sequencing method
        - Developed computational methods spanning upstream processing and downstream TCR-omics analysis
        - Active project with ongoing development

    - title: Research Assistant (Co-author)
      institution: Prof. Wanlu Liu Lab, ZJU-UoE Institute, Zhejiang University
      year: Nov. 2024 – Spring 2025
      description:
        - "Project: SpatialMETA - Integrating Cross-Sample and Cross-Modal Data for Spatial Transcriptomics and Metabolomics"
        - Algorithm development using conditional variation autoencoder for integration of spatial transcriptomics and spatial metabolomics
        - Responsible for setting comprehensive benchmark and metrics for the multimodal spatial integration task
        - Project successfully concluded and accepted for publication

    - title: Independent Research Project (First author)
      institution: ZJU-UoE Institute, Zhejiang University; external collaboration with Prof. Maizie Zhou Lab, Vanderbilt University
      year: Aug. 2024 – Present
      description:
        - "Project: FEAST - Simulation and interpolation of spatial transcriptomics from parameter cloud"
        - Developed a parameter-cloud framework for spatial transcriptomics simulation and 3D interpolation
        - Built vine-copula-based statistical modeling on parameter space
        - Interpolation with optimal transport-driven geodesic path
        - Complete research cycle including literature review, idea exploration, model construction, benchmark and application, manuscript preparation
        - Independent first-author project in final manuscript preparation

    - title: Research Assistant (Co-author)
      institution: ZJU-UoE Institute, Zhejiang University; external collaboration with Prof. Xiuwei Zhang Lab, Georgia Institute of Technology
      year: Apr. 2024 – Sep. 2025
      description:
        - "Project: TemSOMap - Mapping lineage-resolved scRNA-seq data with spatial transcriptomics"
        - Infer cell-to-spot mapping matrix by minimizing a loss function based on expression and lineage in ML framework
        - Performed downstream analyses using TemSOMap, partial benchmark, partial manuscript preparation
        - Collaborative manuscript in final preparation

